<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>HeadReels</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>HeadReels</h1>
    <p class="hint">인스타그램 릴스 탭을 활성 상태로 두세요.</p>
  </header>

  <section class="cam">
    <video id="cam" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
    <div class="status" id="status">대기 중</div>
  </section>

  <section class="controls">
    <button id="start">시작</button>
    <button id="stop" disabled>중지</button>
  </section>

  <section class="thresh">
    <label>위 임계각 (pitch°)
      <input type="range" id="upDeg" min="10" max="45" value="25" step="1">
      <span id="upDegVal">25</span>
    </label>
    <label>아래 임계각 (pitch°)
      <input type="range" id="downDeg" min="10" max="45" value="25" step="1">
      <span id="downDegVal">25</span>
    </label>
    <label>유지 시간 (ms)
      <input type="range" id="hold" min="100" max="1500" value="500" step="50">
      <span id="holdVal">500</span>
    </label>
    <label>쿨다운 (ms)
      <input type="range" id="cooldown" min="500" max="5000" value="1500" step="100">
      <span id="cooldownVal">1500</span>
    </label>
  </section>

  <section class="manual">
    <p class="label">수동 트리거 (인스타 동작 검증용)</p>
    <button id="manualUp">▲ 다음 영상 (위)</button>
    <button id="manualDown">▼ 이전 영상 (아래)</button>
  </section>

  <section class="log">
    <p class="label">최근 이벤트</p>
    <ul id="events"></ul>
  </section>

  <script src="popup.js" type="module"></script>
</body>
</html>
